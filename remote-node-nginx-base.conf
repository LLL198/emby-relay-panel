# Safe example only. emby-relay-panel now renders managed routes from the database.
# Do not paste real source domains or node addresses into this template.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 404;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/uniproxy-nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/uniproxy-nginx/certs/key.pem;
    access_log off;
    location = /__health {
        default_type text/plain;
        return 200 "ok\n";
    }
    location / { return 404; }
}
