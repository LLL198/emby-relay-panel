# Base services for the remote uniproxy node.
# Public ports 30005/30004 are forwarded to this host's 80/443.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass https://onatoshi.114514.quest:443;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name onatoshi.114514.quest;
        proxy_set_header Host onatoshi.114514.quest;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

server {
    listen 81;
    listen [::]:81;
    server_name _;

    location / {
        proxy_pass https://mi.miraiemby.com:443;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name mi.miraiemby.com;
        proxy_set_header Host mi.miraiemby.com;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ss.996878.xyz;
    return 301 https://ss.996878.xyz:30004$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ss.996878.xyz;

    ssl_certificate /etc/nginx/certs/ss.996878.xyz/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/ss.996878.xyz/key.pem;

    location = /__health {
        default_type text/plain;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
